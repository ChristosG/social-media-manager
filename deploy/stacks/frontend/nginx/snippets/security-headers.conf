add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-XSS-Protection "0" always;
# Content-Security-Policy: defence-in-depth behind the app's own URL allowlists. Deliberately permissive
# where Next.js needs it (inline styles/scripts carry no nonce yet) so it can't break the app, while still
# blocking the high-value attacks — no external scripts, no framing (clickjacking), no plugins/objects, and
# form posts only back to us. Tightening script-src to per-request nonces is a follow-up.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
server_tokens off;
