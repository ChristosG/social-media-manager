# Recover the real client IP behind the host reverse proxy.
#
# This nginx runs behind the host nginx (which terminates TLS and sits behind Cloudflare). Without this,
# $remote_addr is the docker-bridge / host-proxy address — identical for every visitor — so limit_req
# keying, access logs, and the X-Real-IP we forward downstream (to the gateway's rate limiter) would all
# collapse to one IP. We trust the private ranges the host proxy connects from and adopt the client IP it
# forwards in X-Real-IP. The host nginx is responsible for setting X-Real-IP to the TRUE client — i.e. it
# must run Cloudflare real_ip (real_ip_header CF-Connecting-IP). Until it does, X-Real-IP is the Cloudflare
# edge IP, which is still strictly better than a single shared bridge IP.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
