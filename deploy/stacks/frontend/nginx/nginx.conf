user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Recover the true client IP behind the host reverse proxy (see snippet) BEFORE log_format / limit_req
    # evaluate $remote_addr, so access logs + per-client rate limiting key on the real visitor, and the
    # X-Real-IP we forward to the gateway is the real client too.
    include /etc/nginx/snippets/realip.conf;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    include /etc/nginx/conf.d/*.conf;
}
