services:
  webapp:
    build:
      context: ../../../
      dockerfile: deploy/stacks/frontend/Dockerfile.nextjs
      args:
        APP_DIR: ${WEBAPP_DIR:-nextjs-starter}
        AUTH_UI_DIR: auth-ui
        APP_NAME: ${APP_NAME:-Social Studio}
    container_name: webapp
    expose:
      - "3000"
    environment:
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - platform-net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      # Bind to loopback by default: the host nginx proxies to 127.0.0.1:<port>, and Docker's port
      # publishing bypasses host ufw/iptables — so a 0.0.0.0 bind would expose the origin directly,
      # letting clients skip Cloudflare + host TLS + the CF allowlist. Set NGINX_BIND_ADDR=0.0.0.0 only
      # for a standalone deploy with no host reverse proxy.
      - "${NGINX_BIND_ADDR:-127.0.0.1}:${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_BIND_ADDR:-127.0.0.1}:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-50M}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      # Network ACL secret injected on the routes nginx serves directly from agent-service (/img, /social/callback).
      AGENT_PROXY_SECRET: ${AGENT_PROXY_SECRET:-}
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|MAX_BODY_SIZE|RATE_LIMIT_RPS|RATE_LIMIT_BURST|AGENT_PROXY_SECRET)$"
    depends_on:
      - webapp
    restart: unless-stopped
    networks:
      - platform-net

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    profiles:
      - ssl

volumes:
  certbot_www:
  certbot_conf:

networks:
  platform-net:
    name: platform-net
