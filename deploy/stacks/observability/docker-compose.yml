# Optional self-hosted Langfuse (v2) for agent-step tracing. Opt-in — NOT part of
# `deploy.sh up all`. Brings up the Langfuse server + its own Postgres, on the shared
# platform-net so the agent-service reaches it at http://langfuse:3000.
#
#   docker compose -f deploy/stacks/observability/docker-compose.yml up -d
#   open http://localhost:3001  → create a project → copy its pk_/sk_ keys
#   put them in deploy/.env as LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY, then
#   ./scripts/deploy.sh update agent-service backend
#
# Everything stays on the box — no telemetry leaves (TELEMETRY_ENABLED=false).
services:
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3001:3000"          # host:container — UI at http://localhost:3001
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET (openssl rand -base64 32)}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT (openssl rand -base64 32)}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY (openssl rand -hex 32)}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # Optional: lock signups after you've created your account.
      AUTH_DISABLE_SIGNUP: ${LANGFUSE_DISABLE_SIGNUP:-false}
      # Headless bootstrap (optional): if you set the LANGFUSE_INIT_* keys below in deploy/.env,
      # Langfuse creates the org/project/user + API keys on first boot — no UI clicks, and the
      # same keys you put in LANGFUSE_PUBLIC_KEY/SECRET_KEY just work. Great for a fresh clone.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-NPO}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-NPO Assistant}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      # Next.js standalone binds to $HOSTNAME (the container id), not loopback —
      # probing localhost is refused even when the server is healthy.
      test: ["CMD-SHELL", "wget -qO- http://$$HOSTNAME:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - platform-net

volumes:
  langfuse_db_data:

networks:
  platform-net:
    name: platform-net
    external: true
