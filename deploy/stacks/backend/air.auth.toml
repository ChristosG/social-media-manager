root = "/app"
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/auth-server ./services/auth/cmd/server"
  bin = "/tmp/air/auth-server"
  delay = 1000
  include_ext = ["go", "proto"]
  include_dir = ["services/auth", "pkg", "proto/gen"]
  exclude_dir = ["vendor", "tmp", "node_modules"]
  exclude_regex = ["_test\\.go$"]
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false
  main_only = true

[misc]
  clean_on_exit = true
