# Cloudflare real client IP — install on the HOST nginx.
#   sudo cp /mnt/nvme2TB/vee/microservices_agents/deploy/nginx-host/cloudflare-realip.conf \
#           /etc/nginx/snippets/cloudflare-realip.conf
#   # then add `include snippets/cloudflare-realip.conf;` to the 443 server block (see cgrigoriadis.online)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Behind Cloudflare, $remote_addr is a Cloudflare edge IP. This makes nginx replace it with the true
# visitor IP from the CF-Connecting-IP header (only for connections that actually come from Cloudflare),
# so X-Real-IP forwarded to the docker nginx → gateway is the real client → correct per-client rate
# limiting + logs. If your existing snippets/cloudflare-origin-allow.conf already lists these
# set_real_ip_from ranges, you only need the final `real_ip_header CF-Connecting-IP;` line.
#
# IMPORTANT: regenerate the ranges periodically from https://www.cloudflare.com/ips
# Cloudflare IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
